{% extends "base.html" %}
{% load static %}
{% block title %}
    Регистрация чека
{% endblock %}
{% block content %}
    <form id="csrf-form" style="display: none;">
        {% csrf_token %}
    </form>
    <div id="root"
         data-page="register"
         data-user-name="{{ request.user.get_full_name|default:request.user.username }}"
         data-user-email="{{ request.user.email }}"
         data-promo-start="{{ promo_start }}"
         data-promo-end="{{ promo_end }}"></div>
{% endblock %}
